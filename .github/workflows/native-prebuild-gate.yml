name: Native pre-build gate

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: native-prebuild-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native-prebuild-verify:
    name: Assets, metadata, typecheck and Native tests
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run prebuild:verify
